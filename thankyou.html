<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Ohwgie</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="style.css?v={{ site.time | date: '%s' }}">
    
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #11122b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 3rem 2rem;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(206, 161, 53, 0.2); 
            box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.4);
        }

        .icon-wrapper {
            font-size: 4rem;
            color: #cea135; 
            margin-bottom: 1.5rem;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-family: 'Marcellus', serif;
            font-size: 2.5rem;
            color: #cea135;
            margin-bottom: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 2rem;
        }

        .back-button {
            display: inline-block;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            color: #11122b;
            background-color: #cea135; 
            padding: 1rem 2.5rem;
            border-radius: 2px;
            transition: all 0.3s;
            border: 2px solid #cea135;
        }

        .back-button:hover {
            background-color: transparent;
            color: #cea135;
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .countdown {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888888;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>

    <script>
        let timeLeft = 5; 
        function startCountdown() {
            const timerElement = document.getElementById('timer');
            const interval = setInterval(() => {
                timeLeft--;
                if (timerElement) {
                    timerElement.textContent = timeLeft;
                }
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    window.location.assign('index.html');
                }
            }, 1000);
        }
        window.onload = startCountdown;
    </script>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1>Message Sent!</h1>
        <p>Thank you for reaching out to Ohwgie. We have received your submission and will get back to you as soon as possible.</p>
        
        <a href="index.html" class="back-button">Back to Home</a>
        
        <div class="countdown">
            Redirecting to home page in <span id="timer">5</span> seconds...
        </div>
    </div>

</body>
</html>
