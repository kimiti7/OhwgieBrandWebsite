<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Supabase Website</title>
    
    <!-- 1. Load the official Supabase library script -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>Data from my Supabase Database:</h1>
    <ul id="list-container">Loading data...</ul>

    <script>
        // 2. Paste your unique Supabase credentials here
        const SUPABASE_URL = "https://iwlfdhyvcdbbqgzfclbr.supabase.co/rest/v1/"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bGZkaHl2Y2RiYnFnemZjbGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTMxMDQsImV4cCI6MjEwMjQ2OTEwNH0.CxsLgFRAfpNBnx3qq4bwegLQSN_huNMYxwMUjDin-4Q";

        // 3. Initialize the Supabase Client connection
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 4. Fetch the data from your table
        async function fetchData() {
            const { data, error } = await supabase
                .from('todos') // Change this to your exact table name
                .select('*');

            const listContainer = document.getElementById('list-container');

            if (error) {
                console.error("Error fetching data:", error);
                listContainer.innerHTML = `<li>Error loading data!</li>`;
                return;
            }

            // Clear the "Loading..." message
            listContainer.innerHTML = "";

            // 5. Loop through the rows and show them on the screen
            data.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.content; // Change 'content' to your column name
                listContainer.appendChild(li);
            });
        }

        // Run the function when the page loads
        fetchData();
    </script>
</body>
</html>
