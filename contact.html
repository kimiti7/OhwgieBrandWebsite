    <!-- Load official Supabase library script via secure CDNJS provider -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.1/supabase.min.js"></script>
    <script>
        // 1. Paste your unique Supabase Project credentials below
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

        // 2. Initialize the Supabase Client connection instance
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Intercept form submissions securely
        document.getElementById('contactForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Stop standard form webpage refresh behavior

            const emailInput = document.getElementById('email').value;
            const nameInput = document.getElementById('name').value;
            const phoneInput = document.getElementById('phone').value;
            const messageInput = document.getElementById('message').value;
            const statusText = document.getElementById('statusText');

            statusText.style.color = "#007bff";
            statusText.innerText = "Sending your message...";

            // 4. Send the payload values directly into your Supabase database table
            // Make sure the table name matches (e.g., 'todos' or 'messages')
            const { data, error } = await supabase
                .from('messages') 
                .insert([
                    { 
                        email: emailInput,
                        name: nameInput,
                        phone: phoneInput,
                        message: messageInput
                    }
                ]);

            // 5. Present simple error handling and clear elements on success
            if (error) {
                console.error("Database error occurred:", error);
                statusText.style.color = "#dc3545";
                statusText.innerText = "❌ Failed to send message. Please try again.";
            } else {
                statusText.style.color = "#28a745";
                statusText.innerText = "🎉 Success! Your message was sent securely.";
                document.getElementById('contactForm').reset(); // Empty form fields
            }
        });
    </script>
